# The identity a jupyter-k8 CI job runs as, and the one thing it may do inside
# the cluster: read the Argo CD Application `jupyter`, and ask Argo CD to
# re-read git now instead of at the next poll. Copied from the splitek runner.
#
# Applied by hand: kubectl apply -f cluster/runner-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyter-runner
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyter-runner-argocd
  namespace: argocd
rules:
  - apiGroups: ['argoproj.io']
    resources: ['applications']
    resourceNames: ['jupyter']
    # get: read the sync status. patch: set argocd.argoproj.io/refresh.
    verbs: ['get', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyter-runner-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyter-runner-argocd
subjects:
  - kind: ServiceAccount
    name: jupyter-runner
    namespace: arc-runners
