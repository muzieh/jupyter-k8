# Login gate in front of Jupyter: every request must carry a session from a
# DSM login on superbox (Synology "SSO Server" package, OIDC). Only the DSM
# users listed in the ConfigMap below get through.
#
# Credentials: Secret `oauth2-proxy` (keys client-id, client-secret,
# cookie-secret), created by hand - see README.md. Never in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-users
data:
  # One DSM username per line. DSM puts the username in the `sub` claim, and
  # --oidc-email-claim=sub makes oauth2-proxy compare it with this list. Not
  # the email claim: DSM users can change their own email address.
  allowed-users: |
    muzieh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app: oauth2-proxy}
  template:
    metadata:
      labels: {app: oauth2-proxy}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=oidc
            # Must equal the `issuer` field of DSM's discovery document,
            # character for character. It comes from SSO Server -> General
            # Settings -> Server URL.
            - --oidc-issuer-url=https://superbox.angora-wahoo.ts.net/webman/sso
            # DSM's discovery document lists its endpoints under /webman/sso/,
            # but on port 443 those .cgi paths return 404: there the DSM login
            # portal is published under the alias /sso/ (SSO Server ->
            # General Settings -> Settings -> Alias). So discovery is skipped
            # and the working URLs are given here. The JWKS file is static and
            # works at the advertised path.
            - --skip-oidc-discovery=true
            - --login-url=https://superbox.angora-wahoo.ts.net/sso/webman/sso/SSOOauth.cgi
            - --redeem-url=https://superbox.angora-wahoo.ts.net/sso/webman/sso/SSOAccessToken.cgi
            - --profile-url=https://superbox.angora-wahoo.ts.net/sso/webman/sso/SSOUserInfo.cgi
            - --oidc-jwks-url=https://superbox.angora-wahoo.ts.net/webman/sso/openid-jwks.json
            - --scope=openid
            - --oidc-email-claim=sub
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-users
            - --code-challenge-method=S256
            - --redirect-url=https://jupyter.angora-wahoo.ts.net/oauth2/callback
            - --upstream=http://jupyter.jupyter.svc.cluster.local:80
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            # Only pods (the tailnet Ingress proxy) may set X-Forwarded-*.
            - --trusted-proxy-ip=10.42.0.0/16
            - --cookie-secure=true
            - --cookie-name=_jupyter_oauth2
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: oauth2-proxy, key: client-id}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: oauth2-proxy, key: client-secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: oauth2-proxy, key: cookie-secret}}
          ports:
            - {containerPort: 4180, name: http}
          volumeMounts:
            - {name: users, mountPath: /etc/oauth2-proxy, readOnly: true}
          readinessProbe:
            httpGet: {path: /ping, port: 4180}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {memory: 128Mi}
      volumes:
        - name: users
          configMap: {name: oauth2-proxy-users}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  type: ClusterIP
  selector: {app: oauth2-proxy}
  ports:
    - {name: http, port: 80, targetPort: 4180}
