# Jupyter has no token of its own any more: oauth2-proxy (DSM login) is the
# only way in. This policy makes that true at the network level - only the
# oauth2-proxy pods may open a connection to the Jupyter pod. Every other pod
# in the cluster, and the tailnet Ingress itself, is refused.
#
# k3s enforces NetworkPolicy with its built-in kube-router controller
# (tested on archi 2026-10-04: an unlisted pod got no connection).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jupyter-only-from-oauth2-proxy
spec:
  podSelector:
    matchLabels: {app: jupyter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: oauth2-proxy}
      ports:
        - {protocol: TCP, port: 8888}
